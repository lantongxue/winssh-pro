# ── SFTP 服务层的错误 ────────────────────────────────────────────────────
# `sftp_err.failed` 是外壳，`%{action}` 由下面那些 `action_*` 填进去 ——
# 拆开是因为同一句"…失败：对端原话"要套二十来件不同的事。
sftp_err.failed:
  en: "%{action} failed: %{message}%{hint}"
  zh-CN: "%{action} 失败：%{message}%{hint}"
sftp_err.hint_no_such_file:
  en: " (the remote says this path does not exist)"
  zh-CN: （远端说这个路径不存在）
sftp_err.hint_permission_denied:
  en: " (not enough permission)"
  zh-CN: （权限不够）
sftp_err.hint_unsupported:
  en: " (the remote does not support this operation)"
  zh-CN: （远端不支持这个操作）
sftp_err.hint_connection_lost:
  en: " (the SFTP channel dropped)"
  zh-CN: （SFTP 通道断了）
sftp_err.action_open_session:
  en: Opening the SFTP session
  zh-CN: 建立 SFTP 会话
sftp_err.action_query_home:
  en: Querying the remote home directory
  zh-CN: 查询远端家目录
sftp_err.action_read_dir:
  en: Reading directory %{path}
  zh-CN: 读取目录 %{path}
sftp_err.action_stat_path:
  en: Checking the path
  zh-CN: 检查路径
sftp_err.action_create_dir:
  en: Creating directory %{path}
  zh-CN: 创建目录 %{path}
sftp_err.action_create_file:
  en: Creating file %{path}
  zh-CN: 创建文件 %{path}
sftp_err.action_delete:
  en: Deleting %{path}
  zh-CN: 删除 %{path}
sftp_err.action_delete_dir:
  en: Deleting directory %{path}
  zh-CN: 删除目录 %{path}
sftp_err.action_rename:
  en: Renaming %{from} to %{to}
  zh-CN: 把 %{from} 改名为 %{to}
sftp_err.action_chmod:
  en: Changing the permissions of %{path}
  zh-CN: 修改 %{path} 的权限
sftp_err.action_read_file:
  en: Reading %{path}
  zh-CN: 读取 %{path}
sftp_err.action_save_file:
  en: Saving %{path}
  zh-CN: 保存 %{path}
sftp_err.action_stat_remote:
  en: Inspecting remote path %{path}
  zh-CN: 查看远端路径 %{path}
sftp_err.action_open_remote:
  en: Opening remote file %{path}
  zh-CN: 打开远端文件 %{path}
sftp_err.action_create_remote_temp:
  en: Creating remote temporary file %{path}
  zh-CN: 创建远端临时文件 %{path}
sftp_err.action_finalize_remote:
  en: Putting %{path} into place
  zh-CN: 落下 %{path}
sftp_err.action_stat_remote_dir:
  en: Checking remote directory %{path}
  zh-CN: 检查远端目录 %{path}
sftp_err.action_create_remote_dir:
  en: Creating remote directory %{path}
  zh-CN: 创建远端目录 %{path}
sftp_err.action_read_remote_dir:
  en: Reading remote directory %{path}
  zh-CN: 读取远端目录 %{path}
sftp_err.already_exists:
  en: "%{path} already exists"
  zh-CN: "%{path} 已经存在"
sftp_err.too_large_to_edit:
  en: The file is %{bytes} bytes, over the editable limit
  zh-CN: 文件 %{bytes} 字节，超过可编辑的上限
sftp_err.not_utf8:
  en: "%{path} is not UTF-8 text and cannot be edited here"
  zh-CN: "%{path} 不是 UTF-8 文本，不能在这里编辑"
sftp_err.bad_mode:
  en: "Permissions have to be octal 0000–7777, got %{mode}"
  zh-CN: 权限只能是八进制 0000~7777，收到 %{mode}
sftp_err.download_incomplete:
  en: "Download incomplete: %{moved} / %{total} bytes"
  zh-CN: 下载不完整：%{moved} / %{total} 字节
sftp_err.upload_incomplete:
  en: "Upload incomplete: %{moved} / %{total} bytes"
  zh-CN: 上传不完整：%{moved} / %{total} 字节
sftp_err.create_local_dir:
  en: Could not create local directory %{path}
  zh-CN: 创建本地目录 %{path} 失败
sftp_err.create_local_temp:
  en: Could not create local temporary file %{path}
  zh-CN: 创建本地临时文件 %{path} 失败
