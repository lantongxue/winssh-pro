  en: "High compression (Tight) only applies in 32-bit true colour; other depths fall back to Zrle. Exclusive disconnects viewers already on this desktop. The clipboard charset only matters for servers without the extended clipboard: RFB's plain cut text carries no charset, so a Windows server uses its own ANSI code page - pick GBK for a Simplified Chinese one if pasted Chinese comes out garbled."
