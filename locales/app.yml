host_form.serial_hint:
  en: "Leave DTR and RTS at their default unless the device needs them driven: asserting DTR can reset some boards, and clearing RTS can stop some devices from sending at all. Local echo is for devices that never echo your typing back."
  zh-CN: "DTR / RTS 除非设备需要，否则留在默认档：拉高 DTR 会把某些开发板复位，拉低 RTS 会让某些设备不再回数据。本地回显给的是“对端不回显你敲的字”的裸设备。"
