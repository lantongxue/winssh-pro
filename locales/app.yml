  en: No private key is configured, so key authentication cannot be used
  zh-CN: 未配置私钥，无法使用密钥认证
ssh.key_decode_failed:
  en: This is not a private key we can read (a public key was pasted, or part of it is missing)
  zh-CN: 这不是一份能识别的私钥（可能粘成了公钥，或者少复制了一段）
ssh.key_encrypted:
  en: The private key is encrypted, but no passphrase is configured for this host
  zh-CN: 私钥已加密，但这台主机没有配置私钥密码
ssh.key_passphrase_wrong:
  en: The private key could not be decrypted, the passphrase may be wrong
  zh-CN: 私钥解不开，私钥密码可能不对
ssh.auth_password_failed:
  en: "Password authentication failed (methods the remote still offers: %{remaining})"
  zh-CN: 密码认证失败（对端剩余方法：%{remaining}）
ssh.auth_key_failed:
  en: "Key authentication failed (methods the remote still offers: %{remaining})"
  zh-CN: 密钥认证失败（对端剩余方法：%{remaining}）
ssh.auth_agent_failed:
  en: "Agent authentication failed (methods the remote still offers: %{remaining})"
  zh-CN: Agent 认证失败（对端剩余方法：%{remaining}）

# ── SSH 端口转发 ─────────────────────────────────────────────────────────
ssh_forward.bind_failed:
  en: "Binding %{bind}:%{port} on this machine failed"
  zh-CN: "绑定本机 %{bind}:%{port} 失败"
ssh_forward.local_port_failed:
  en: Reading the local listening port failed
  zh-CN: 读取本机监听端口失败
ssh_forward.remote_refused:
  en: "The remote refused to listen on %{bind}:%{port}"
  zh-CN: "对端拒绝在 %{bind}:%{port} 上监听"
ssh_forward.remote_no_port:
  en: The remote accepted the forwarding request but did not tell us the port
  zh-CN: 对端接受了转发请求但没有告诉我们端口
ssh_forward.channel_failed:
  en: The forwarding channel could not be opened
  zh-CN: 转发通道开不出来
ssh_forward.channel_target:
  en: "%{reason} (target %{host}:%{port})"
  zh-CN: "%{reason}（目标 %{host}:%{port}）"
ssh_forward.reject_prohibited:
  en: The remote does not allow this forward
  zh-CN: 对端不允许这次转发
ssh_forward.reject_connect_failed:
  en: The remote could not reach the target
  zh-CN: 对端连不上目标
ssh_forward.reject_unknown_type:
  en: The remote does not recognise this channel type
  zh-CN: 对端不认识这种通道
ssh_forward.reject_resource:
  en: The remote is short on resources
  zh-CN: 对端资源不足
ssh_forward.reject_other:
  en: The remote refused this forward
  zh-CN: 对端拒绝了这次转发
ssh_forward.socks_read_greeting:
  en: Reading the SOCKS5 method negotiation failed
  zh-CN: 读 SOCKS5 方法协商失败
ssh_forward.socks_not_v5:
  en: Not a SOCKS5 request (version %{version})
  zh-CN: 不是 SOCKS5 请求（版本号 %{version}）
ssh_forward.socks_read_methods:
  en: Reading the SOCKS5 authentication method list failed
  zh-CN: 读 SOCKS5 认证方法列表失败
ssh_forward.socks_no_anon:
  en: The client does not accept SOCKS5 without authentication
  zh-CN: 客户端不接受无认证的 SOCKS5
ssh_forward.socks_write_choice:
  en: Replying with the chosen SOCKS5 method failed
  zh-CN: 回 SOCKS5 方法选择失败
ssh_forward.socks_read_request:
  en: Reading the SOCKS5 request failed
  zh-CN: 读 SOCKS5 请求失败
ssh_forward.socks_only_connect:
  en: Only SOCKS5 CONNECT is supported (got command %{command})
  zh-CN: 只支持 SOCKS5 的 CONNECT（收到命令 %{command}）
ssh_forward.socks_domain_not_utf8:
  en: The SOCKS5 domain name is not UTF-8
  zh-CN: SOCKS5 域名不是 UTF-8
ssh_forward.socks_bad_atyp:
  en: SOCKS5 address type %{atyp} is not recognised
  zh-CN: SOCKS5 地址类型 %{atyp} 不认识
ssh_forward.socks_read_port:
  en: Reading the SOCKS5 target port failed
  zh-CN: 读 SOCKS5 目标端口失败
ssh_forward.socks_write_reply:
  en: Replying to the SOCKS5 request failed
  zh-CN: 回 SOCKS5 答复失败

# ── SFTP 子系统 ──────────────────────────────────────────────────────────
ssh_sftp.open_channel_failed:
  en: Opening the SFTP channel failed
  zh-CN: 打开 SFTP 通道失败
ssh_sftp.request_subsystem_failed:
  en: Requesting the SFTP subsystem failed
  zh-CN: 请求 SFTP 子系统失败
ssh_sftp.handshake_failed:
  en: The SFTP protocol handshake failed
  zh-CN: SFTP 协议握手失败
ssh_sftp.subsystem_refused:
  en: "The remote refused to start the SFTP subsystem (no `Subsystem sftp` in sshd_config, or the remote only allows a shell)"
  zh-CN: "远端拒绝启动 SFTP 子系统（sshd_config 里没有 `Subsystem sftp`，或对端只允许 Shell）"
ssh_sftp.closed_early:
  en: The remote closed the channel before the SFTP subsystem started
  zh-CN: 远端在启动 SFTP 子系统之前关掉了通道
ssh_sftp.disconnected:
  en: The connection dropped while waiting for the SFTP subsystem to answer
  zh-CN: 等待 SFTP 子系统回音时连接已断开

# ── 远端命令执行 ─────────────────────────────────────────────────────────
ssh_exec.exit_status:
  en: The remote command exited with status %{status}
  zh-CN: 远端命令退出码 %{status}
ssh_exec.no_output:
  en: The remote command produced neither output nor an exit code
  zh-CN: 远端命令没有输出也没有退出码
ssh_exec.timeout:
  en: The remote command did not return within %{seconds} s
  zh-CN: 远端命令超过 %{seconds} 秒未返回
ssh_exec.open_channel_failed:
  en: Opening the sampling channel failed
  zh-CN: 打开采集通道失败
ssh_exec.start_sh_failed:
  en: Starting /bin/sh on the remote failed
  zh-CN: 远端启动 /bin/sh 失败
ssh_exec.send_script_failed:
  en: Sending the sampling script failed
  zh-CN: 发送采集脚本失败
ssh_exec.close_write_failed:
  en: Closing the write end of the sampling channel failed
  zh-CN: 关闭采集通道的写端失败

# ── 终端里那几行方括号提示 ───────────────────────────────────────────────
bridge.send_failed:
  en: "[send failed: %{error}]"
  zh-CN: "[发送失败：%{error}]"
bridge.channel_closed:
  en: "[the SSH channel is closed]"
  zh-CN: "[SSH 通道已关闭]"
bridge.remote_exit:
  en: "[the remote exited, status %{status}]"
  zh-CN: "[远端退出，状态码 %{status}]"
bridge.remote_signal:
  en: "[the remote was signalled: %{signal}]"
  zh-CN: "[远端信号 %{signal}]"
