_version: 2

# 这个程序自己的文案。key 按"模块.位置.用途"分段，和 `src/` 下的目录对得上，
# 找一条文案在哪儿用的时候直接 grep key 就行。
#
# `%{name}` 是占位符，对应 `t!("key", name => value)`。同一条文案里占位符的
# 名字两种语言必须一致 —— 少一个不会编译报错，只会在界面上留下一段 `%{name}`。

