  en: "Automatic offers both TLS and NLA and lets the server pick; NLA required refuses servers without it. The certificate is not verified (same as the IronRDP default), so use this on networks you trust. Narrow band turns off wallpaper, themes and cursor shadows on the remote side."
  zh-CN: "自动档同时报 TLS 与 NLA、由服务器挑；NLA 强制会拒绝不支持 NLA 的服务器。证书不验证（IronRDP 的出厂取舍），请在信得过的网络里用。窄带档会让远端关掉壁纸、主题与光标阴影。"
