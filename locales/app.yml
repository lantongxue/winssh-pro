  zh-CN: "监听连入"
host_form.field_easytier_listen_port:
  en: "Listening port"
  zh-CN: "监听端口"
host_form.easytier_listen_hint:
  en: "Expanded the same way as easytier-core -l: tcp and udp use this port, wg and ws use +1, quic and wss use +2."
  zh-CN: "和 easytier-core -l 一样展开：tcp、udp 用这个端口，wg、ws 用 +1，quic、wss 用 +2。"
host_form.easytier_access_socks5_hint:
  en: "User space needs no administrator rights: the node opens a SOCKS5 entry on 127.0.0.1, and hosts in this app reach the network by choosing Via EasyTier network as their proxy. Other nodes cannot reach this computer by its virtual IP in this mode."
  zh-CN: "用户态不要管理员权限：本机在 127.0.0.1 上开一个 SOCKS5 入口，本应用里的主机把代理选成「经 EasyTier 组网」就能进这张网。这一档别的节点访问不到本机的虚拟 IP。"
host_form.easytier_access_tun_hint:
  en: "A virtual NIC lets every program on this computer reach the network, but WinSSH Pro must run as administrator (root), and on Windows wintun.dll must sit next to the program."
  zh-CN: "虚拟网卡让本机所有程序都能直接访问这张网，但 WinSSH Pro 要以管理员（root）身份运行，Windows 上还要 wintun.dll 在程序旁边。"
host_form.field_easytier_latency_first:
  en: "Latency-first routing"
  zh-CN: "延迟优先选路"
host_form.field_easytier_encryption:
  en: "Encryption"
  zh-CN: "加密"
host_form.easytier_routing_hint:
  en: "Latency-first picks the fastest relay path instead of the fewest hops. Encryption must match across the whole network: a node with it off cannot talk to one with it on."
  zh-CN: "延迟优先按时延而不是跳数挑中继路径。加密要全网一致 —— 关了加密的节点和开着的谈不拢。"
