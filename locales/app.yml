  zh-CN: "tcp://public.easytier.cn:11010"
host_form.field_easytier_proxy_networks:
  en: "Subnets to share"
  zh-CN: "代理给网络的子网"
host_form.easytier_proxy_networks_placeholder:
  en: "192.168.1.0/24"
  zh-CN: "192.168.1.0/24"
host_form.easytier_proxy_networks_hint:
  en: "One per line, like easytier-core -n: other nodes reach these subnets (usually the LAN this computer is on) through this node, e.g. 192.168.1.0/24. If a subnet clashes with someone else's, map it, e.g. 192.168.1.0/24->10.1.1.0/24, and the others use the latter. Either access mode can act as the gateway, but forwarding ping for others needs WinSSH Pro to run as administrator (TCP and UDP are not affected). Leave it empty to share nothing."
  zh-CN: "一行一个，写法同 easytier-core -n：别的节点经本机访问这些网段（多半是本机所在的局域网），如 192.168.1.0/24。和别人的网段重名时加映射，如 192.168.1.0/24->10.1.1.0/24，别人用后者访问。两种接入方式都能当网关，但替别人转发 ping 要以管理员身份运行 WinSSH Pro（TCP / UDP 不受影响）。留空就不代理。"
host_form.easytier_peers_hint:
  en: "One per line: a public server or any node that listens, e.g. tcp://public.easytier.cn:11010. Every EasyTier tunnel works (tcp, udp, ws, wss, quic, wg), as do discovery addresses (txt://, srv://, http(s)://); the port may be left out. faketcp is not built in: it needs raw sockets and, on Windows, Npcap."
  zh-CN: "一行一个：公共服务器，或者任何一台开着监听的节点，如 tcp://public.easytier.cn:11010。EasyTier 的隧道都能用（tcp、udp、ws、wss、quic、wg），节点发现地址（txt://、srv://、http(s)://）也行；端口可以不写。faketcp 没有编进来：它要原始套接字权限，Windows 上还要装 Npcap。"
