# ── 端口转发：三档的说明文字（src/forward.rs） ───────────────────────────
# `badge()` 上那三个全大写的标签（LOCAL FORWARD / …）不进这张表：它们照的是
# ssh 自己的 LocalForward / RemoteForward / DynamicForward 那套行话，两种语言
# 下都是同一个词；停在徽章上给的那句人话（tagline）才是要翻的。
forward.label_local:
  en: -L Local
  zh-CN: -L 本地
forward.label_remote:
  en: -R Remote
  zh-CN: -R 远端
forward.label_dynamic:
  en: -D Dynamic
  zh-CN: -D 动态
forward.pipe_local:
  en: Encrypted SSH Pipe
  zh-CN: 加密 SSH 隧道
forward.pipe_remote:
  en: Reverse SSH Pipe
  zh-CN: 反向 SSH 隧道
forward.pipe_dynamic:
  en: SOCKS5 Proxy
  zh-CN: SOCKS5 代理
forward.tagline_local:
  en: Map a service only the remote can reach onto a port on this machine
  zh-CN: 把远端才能访问的服务，映到本机的一个端口上
forward.tagline_remote:
  en: Expose a service on this machine to the remote side
  zh-CN: 把本机的服务，开给远端那边访问
forward.tagline_dynamic:
  en: Open a SOCKS5 proxy locally and browse through the remote machine
  zh-CN: 本机开一个 SOCKS5 代理，整台远端当跳板上网
forward.detail_local:
  en: Some service on the remote (or inside its private network) is not reachable from here. Turn this on and this machine gains a port; connecting to it is the same as connecting to that service. Remote databases, Redis and web consoles all go through this one.
  zh-CN: 远端（或它内网里）的某个服务，你本机直连不到。起了这一档，本机就多出一个端口，连它就等于连那个服务。访问远端的数据库、Redis、Web 面板都走这一档。
forward.detail_remote:
  en: The other direction — ask the remote to open a port, and traffic arriving there comes back to a service on this machine. Use it when a program or a colleague on the remote side needs something on your machine and you would rather not expose it to the internet. Without GatewayPorts on the remote sshd, only the remote itself can reach that port.
  zh-CN: 方向反过来：请远端开一个端口，远端那边连上来的流量回到本机的服务上。想让远端的程序或同事访问你机器上的东西，又不愿把电脑暴露到公网时用它。远端 sshd 没开 GatewayPorts 的话，那个端口只有远端自己连得上。
forward.detail_dynamic:
  en: No target needed — this machine opens a SOCKS5 proxy port, and once a browser or tool points at it, every address it asks for is fetched by the remote instead. It is the same as sitting on that remote machine.
  zh-CN: 不用指定目标：本机开一个 SOCKS5 代理端口，浏览器或工具配上它之后，访问哪个地址都由远端代为发出 —— 相当于坐在远端那台机器上上网。
forward.example_local:
  en: "e.g. local 15432 → 10.0.4.15:5432 on the remote network; point the database client at 127.0.0.1:15432"
  zh-CN: "例：本机 15432 → 远端内网的 10.0.4.15:5432，数据库客户端填 127.0.0.1:15432 即可"
forward.example_remote:
  en: "e.g. remote 8080 → 127.0.0.1:3000 here; a browser on the remote opening 8080 sees your service"
  zh-CN: "例：远端 8080 → 本机的 127.0.0.1:3000，远端浏览器开 8080 看到的就是它"
forward.example_dynamic:
  en: "e.g. SOCKS5 on local 1080; set the browser proxy to 127.0.0.1:1080 and pages only the remote network can reach will open"
  zh-CN: "例：本机 1080 上的 SOCKS5，浏览器代理填 127.0.0.1:1080，就能打开只有远端内网才通的页面"
forward.listen_label_remote:
  en: Remote listen port
  zh-CN: 远端监听端口
forward.listen_label_local:
  en: Local listen port
  zh-CN: 本地监听端口
forward.check_no_name:
  en: Give this forward a name so you can pick it out of the list.
  zh-CN: 给这条转发起个名字，列表里要认得出它。
forward.check_listen_port:
  en: The listen port must be a number between 1 and 65535.
  zh-CN: 监听端口要填 1~65535 之间的一个数。
forward.check_bind_address:
  en: The listen address cannot be empty; 127.0.0.1 is the usual choice for a local listener.
  zh-CN: 监听地址不能空着，本机监听一般填 127.0.0.1。
forward.check_target_host:
  en: The target address cannot be empty.
  zh-CN: 目标地址不能空着。
forward.check_target_port:
  en: The target port must be a number between 1 and 65535.
  zh-CN: 目标端口要填 1~65535 之间的一个数。
forward.preset_mysql:
  en: Remote MySQL 3306 mapped to this machine
  zh-CN: 远端 MySQL 3306 映到本机
forward.preset_postgresql:
  en: Remote PostgreSQL 5432 mapped to this machine
  zh-CN: 远端 PostgreSQL 5432 映到本机
forward.preset_redis:
  en: Remote Redis 6379 mapped to this machine
  zh-CN: 远端 Redis 6379 映到本机
forward.preset_socks5:
  en: SOCKS5 proxy on local 1080, the whole machine as a jump box
  zh-CN: 本机 1080 上的 SOCKS5 代理，整台机器当跳板

