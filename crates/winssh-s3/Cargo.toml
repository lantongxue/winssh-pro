[package]
name = "winssh-s3"
version = "0.1.0"
edition = "2024"
description = "WinSSH Pro 的 S3 对象存储后端：SigV4 客户端、列桶/列对象、服务商预设"
license = "Apache-2.0"

[dependencies]
# S3 的连接设置（`S3Settings` / `S3Addressing`）在领域层，这里再导出。
winssh-domain = { workspace = true }
# rust-s3 一个 `Bucket` 就是完整的 S3 客户端（lib 名是 `s3`）。
rust-s3 = { workspace = true }
anyhow = { workspace = true }
rust-i18n = { workspace = true }
# 对象 mtime 是 Unix 时间戳，按本地时区显示。
chrono = { workspace = true }
