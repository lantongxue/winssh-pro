[package]
name = "winssh-zmodem"
version = "0.1.0"
edition = "2024"
description = "WinSSH Pro 的 ZMODEM 会话层：rz/sz 状态机、签名嗅探与下载目录配置"
license = "MIT"

[dependencies]
# 落盘只借本地文件工具那一份（下载起始目录、唯一本地路径）。
winssh-localfs = { workspace = true }
# 纯 Rust、零传递依赖的 caller-driven ZMODEM 状态机。
zmodem2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
gpui-kit = { workspace = true }
rust-i18n = { workspace = true }
