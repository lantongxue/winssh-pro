[package]
name = "winssh-terminal"
version = "0.1.0"
edition = "2024"
description = "WinSSH Pro 终端内核：VT 解析/屏幕缓冲（alacritty_terminal）、Emulator、键位、搜索、shell 集成、WSL、光标/字体/配色全局"
license = "MIT"

[features]
# 把 Emulator 的“协议方向收件箱”（`sent_by_test` / `take_sent_by_test`）编进来，
# 供根包的 ui 测试（zmodem 传输那几幅）验离线协议方向。正式构建不带。
test-support = []

[dependencies]
# 领域数据：命令历史类型（`CommandRun`）等。
winssh-domain = { workspace = true }
# 终端会话经这几条传输收发字节。
winssh-ssh = { workspace = true }
winssh-telnet = { workspace = true }
winssh-serial = { workspace = true }
# rz/sz 文件收发。
winssh-zmodem = { workspace = true }
# 终端内核本体：VT 解析、屏幕缓冲、滚动回卷、PTY。
alacritty_terminal = { workspace = true }
# 交互式 shell 通道要用到的 russh 类型。
russh = { workspace = true }
# Emulator 与传输桥接、发往对端的字节经应用级 runtime。
tokio = { workspace = true }
futures = { workspace = true }
# 光标/字体/配色的共享状态与文本用 gpui 的类型。
gpui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
