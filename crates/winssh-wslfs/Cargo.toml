[package]
name = "winssh-wslfs"
version = "0.1.0"
edition = "2024"
description = "WinSSH Pro 的 WSL 接入层：Linux 路径 ⇄ \\\\wsl.localhost 共享（列目录、读写、删除、chmod），以及经 wsl.exe 在发行版里跑一次性命令（监控采集、kill）"
license = "Apache-2.0"

[dependencies]
# 目录项复用 SFTP 面板那套模型（`FileEntry` / `FileKind`），两栏画在同一张表下。
winssh-sftp = { workspace = true }
# 阻塞式 std::fs 与 wsl.exe 子进程经应用级 tokio runtime 的 blocking 池跑。
winssh-db = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
