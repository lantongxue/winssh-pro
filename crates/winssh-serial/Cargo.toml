[package]
name = "winssh-serial"
version = "0.1.0"
edition = "2024"
description = "WinSSH Pro 的本机串口后端：串口桥（读写线程）与连接"
license = "Apache-2.0"

[dependencies]
# 领域数据：照 `Host` 拨号（设备路径在 hostname 里）。
winssh-domain = { workspace = true }
# 跨平台同步串口库；关掉默认 libudev，Linux 退回扫 /sys/class/tty。
serialport = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
