[package]
name = "winssh-pro"
version = "0.1.0"
edition = "2024"
description = "A native cross-platform SSH client"
license = "MIT"

# Clash 那一档要的提权小助手（见 `src/bin/broker.rs`）：GUI 留在用户态，
# 拨 TUN 时经 UAC 把它拉起来，由它代为启动/看住 mihomo。发版产物名用连字符
# 与主程序对齐（`winssh-broker.exe`）。main.rs 那条不用显式声明 ——
# autobins 照旧把它发现成 `winssh-pro`。
[[bin]]
name = "winssh-broker"
path = "src/bin/broker.rs"

[package.metadata.deb]
maintainer = "WinSSH Pro contributors <noreply@github.com>"
copyright = "2026 WinSSH Pro contributors"
depends = "$auto, libfontconfig1, libwayland-client0, libx11-xcb1, libxkbcommon0, libxkbcommon-x11-0"
section = "net"
priority = "optional"
assets = [
	["target/release/winssh-pro", "usr/bin/winssh-pro", "755"],
	["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/winssh-pro.svg", "644"],
	["assets/app-icon.png", "usr/share/pixmaps/winssh-pro.png", "644"],
	["assets/winssh-pro.desktop", "usr/share/applications/winssh-pro.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
	{ source = "target/release/winssh-pro", dest = "/usr/bin/winssh-pro", mode = "755" },
	{ source = "assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/winssh-pro.svg", mode = "644" },
	{ source = "assets/app-icon.png", dest = "/usr/share/pixmaps/winssh-pro.png", mode = "644" },
	{ source = "assets/winssh-pro.desktop", dest = "/usr/share/applications/winssh-pro.desktop", mode = "644" },
]

# 本工程是一个 Cargo workspace：根包 `winssh-pro` 保留应用外壳（main / ui /
# build.rs / 两个 bin），领域与后端代码按分层拆进 `crates/*` 下的独立 lib crate
# （见 AGENTS.md 的「crate 分层与依赖方向」）。依赖只能自上而下：
# domain ← db ← repository ← 各后端 ← service ← 根包（ui）。
# 所有第三方依赖的版本钉子统一收在下面的 `[workspace.dependencies]`，各成员
# crate 用 `dep = { workspace = true }` 继承，避免同一份 gpui / russh / ironrdp
# 在不同 crate 里钉歪成两份不兼容的类型。`[patch.crates-io]` 与 `[profile.*]`
# 留在 workspace 根，对全体成员生效。
[workspace]
members = ["crates/*"]
# `refs/`（gpui-kit、alacritty 两个 git 子模块）与 `vendor/`（各补丁副本）各自
# 是独立的 crate / workspace，只是恰好落在本仓库目录树下、又被我们以 path 依赖
# 引进来。不 exclude 的话，cargo 会把这些子目录当成“本 workspace 的候选成员”
# 去解析它们的 `edition.workspace = true` 之类的继承，转而到本根来找
# `[workspace.package]`（本根没定义）而报错。exclude 让它们各自回到自己
# 所属的 workspace 根去解析。
exclude = ["refs", "vendor"]
resolver = "2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[workspace.dependencies]
# 本工程自己的分层 crate（见 `crates/`）。依赖只能自上而下：
# domain ← db ← repository ← 各后端 ← service ← 根包（ui）。
winssh-domain = { path = "crates/winssh-domain" }
winssh-tls = { path = "crates/winssh-tls" }
winssh-db = { path = "crates/winssh-db" }
winssh-repository = { path = "crates/winssh-repository" }
winssh-easytier = { path = "crates/winssh-easytier" }
winssh-proxy = { path = "crates/winssh-proxy" }
winssh-ssh = { path = "crates/winssh-ssh" }
winssh-sftp = { path = "crates/winssh-sftp" }
winssh-localfs = { path = "crates/winssh-localfs" }
winssh-s3 = { path = "crates/winssh-s3" }
winssh-serial = { path = "crates/winssh-serial" }
winssh-telnet = { path = "crates/winssh-telnet" }
winssh-webdav = { path = "crates/winssh-webdav" }
winssh-ftp = { path = "crates/winssh-ftp" }
winssh-broker-protocol = { path = "crates/winssh-broker-protocol" }
winssh-clash = { path = "crates/winssh-clash" }
winssh-assistant = { path = "crates/winssh-assistant" }
winssh-zmodem = { path = "crates/winssh-zmodem" }
winssh-terminal = { path = "crates/winssh-terminal" }
winssh-desktop = { path = "crates/winssh-desktop" }
winssh-netstats = { path = "crates/winssh-netstats" }
winssh-vnc = { path = "crates/winssh-vnc" }
winssh-rdp = { path = "crates/winssh-rdp" }
winssh-backup = { path = "crates/winssh-backup" }
winssh-monitor = { path = "crates/winssh-monitor" }
winssh-service = { path = "crates/winssh-service" }
anyhow = "1"

# GPUI 与组件库都从 gpui-kit 这一个门面 crate 进来（原 longbridge/gpui-component
# 仓库已并进去，见 refs/gpui-kit）。应用侧只列这一行，各层按名字取：
#
#     gpui_kit::*          gpui 本体
#     gpui_kit::component  带样式的组件库（原 `gpui-component`）
#     gpui_kit::assets     默认图标集（原 `gpui-kit-assets`）
#     gpui_kit::platform   平台层，`gpui_kit::application()` 从这儿来
#     gpui_kit::init(cx)   一次把上面这些都初始化掉
#
# 不再单独列 gpui。zed 的 gpui 一族由 gpui-kit 按 `gpui-pre-*` 的名字整套发到
# crates.io（`gpui` → `gpui-pre`、`gpui_platform` → `gpui-pre-platform`，同一个
# zed commit 同一个版本号），component 与 base 都钉在那份快照上 —— 自己再列一份
# 就是两份不同的 gpui 类型，编不过。整组版本由门面 crate 钉住，这里少一处能钉歪
# 的地方；跟新快照就是 `cargo update`，0.6 与 0.3 都是 caret 需求。
# `tree-sitter-languages` 一次打开组件库里全部 35 种语法（bash/shell、python、rust、
# go、c/c++、js/ts、json/yaml/toml、sql、markdown…… 见 refs/gpui-kit 的
# `crates/component/Cargo.toml`）。不开任何语法 feature 时，编辑器的 `.language(..)`
# 是空操作、源码不涂色（原 SFTP 编辑对话框就吃过这个亏）；开了之后 `SftpEditorPanel`
# 才真的高亮。代价是这些语法的 tree-sitter 语法是 C crate，首次要多编一会儿、二进制
# 大几 MB —— 想瘦身就把这一行换成精选子集（如只留 tree-sitter-bash / -python / -yaml…），
# 未知语言本就优雅退化为纯文本，改不改都不影响正确性。
gpui-kit = { path = "refs/gpui-kit/crates/kit", version = "0.7.1", features = ["tree-sitter-languages"] }

# 帧率浮层（设置里那个"FPS 监控"开关点亮的那块 HUD）。读数来自 gpui 自己的
# 帧追踪（`gpui::FrameTimingCollector`），量的是框架真正花在 `Window::draw`
# 里的时间，不是从外面估的；GPU / CPU / 内存那三行按平台各自的按进程计数器读，
# 不要 SDK 也不要提权。和 gpui-kit 同一个仓库、同一个版本号，因此钉在同一份
# `gpui-pre` 快照上 —— 这是它能用的前提：换一份 gpui 就是两套不兼容的 `Window`
# 类型，报错还只说类型对不上，不说版本。走本地检出与 gpui-kit 一致。
gpui-fps = { path = "refs/gpui-kit/crates/fps", version = "0.7.1" }

# 终端内核。VT 解析、屏幕缓冲、滚动回卷与 PTY 都由 alacritty 提供。
# 用的是 zed 的那个 fork，rev 与 `refs/zed` 自己钉的一致（见 refs/alacritty）：
# `src/terminal/` 是照着 zed 的 `crates/terminal` + `crates/terminal_view`
# 移植的，API 必须对得上。落到本地检出，不走网络克隆。
alacritty_terminal = { path = "refs/alacritty/alacritty_terminal", version = "0.26.1-dev" }

# 终端里的 rz/sz 文件收发（ZMODEM 协议）。`zmodem2` 是纯 Rust、零传递依赖的
# caller-driven 状态机：`Sender`/`Receiver` 只吐动作（写线、读文件、写文件、
# 事件），字节的进出全归我们 —— 正好把终端的入站流与 `Transport` 的出站
# 接上。选它而不是 fork lrzsz：协议里 hex/bin16/bin32 三种头、ZDLE 转义、
# CRC 回退、子包与回执这些细节，自己写一份等于把几十年的兼容性坑重踩一遍。
# 0.7.2 支持手动接受文件（等用户决策期间不产线字节）与批量传输，见
# `src/zmodem/session.rs`。
zmodem2 = "0.7.2"
futures = "0.3"
async-trait = "0.1"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = "0.11"

# SSH 传输：russh 是 Tokio 上的异步 SSH-2 客户端/服务端实现，aws-lc-rs 为默认加密后端。
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs", "rsa"] }
ssh-key = { version = "0.7.0-rc.11", features = ["encryption"] }

# Telnet 协议：`telnet` 是 SLMT/telnet-rs（crates.io 上的 crate 名叫 `telnet`），
# 一个纯协议层的小库 —— 它不碰 socket，也不代跑事件循环，只把已经拿到手的
# `std::net::TcpStream` 包成 `Telnet<TcpStream>`，读的时候过滤 IAC 并自动回应
# WILL/WONT/DO/DONT，写的时候把控制命令插进待发队列。我们这边照 SSH 那一条桥的
# 形状套：`std::net::TcpStream` 开成 nonblocking、丢进 `spawn_blocking` 跑读写循
# 环，两端接 `mpsc::unbounded_channel`，`Emulator` 收到的还是普通字节。
#
# 0.2.5 是 crates.io 上的最新稳定版（作者最后一次发版是 2021 年），API 简单、
# 无异步 runtime 依赖、不携带任何加密或 C 绑定 —— 与项目"依赖越少越好"的取向
# 吻合；协商矩阵不完美的那部分（新终端类型、压缩扩展）我们在 `src/telnet/`
# 里手工补，不去 fork 它。
telnet = "0.2"

# 串口协议：`serialport` 是跨平台的同步串口库（Unix 的 termios / IOKit、
# Windows 的 DCB 全在内），提供打开、参数设置、双向读写与设备枚举。
# 它和上面的 `telnet` 一样是**同步阻塞** API：读要配 `timeout`，同一句柄
# 不能同时读又写，所以要读写并行就得 `try_clone` 一份 —— 因此照 Telnet
# 那条桥的形状走两条 OS 线程，而不是硬套进 tokio。
#
# `default-features = false` 关掉默认的 `libudev`：开着它 Linux 构建要装
# `libudev-dev`、运行还要 `libudev.so.1`，与"不依赖系统安装的库"的取向
# 冲突。关掉之后 Linux 的 `available_ports` 退回扫 `/sys/class/tty`（库自己
# 的回退路径），设备名一个不少，只是少了 USB 的 VID/PID 这类元数据 ——
# 我们只用设备名，够了。
serialport = { version = "4.8", default-features = false }

# SFTP 客户端。`russh-sftp` 只讲 SFTP 协议本身，字节流从外面喂进去
# （`SftpSession::new(stream)`），russh 是它的 dev-dependency 而已 —— 所以这里
# 用 0.63 的 russh 不会有版本打架；它自己不碰 socket，子系统通道还是我们的
# `ssh::sftp` 开。`tokio-util` 是它的传递依赖，这里直接用它的
# `CancellationToken` 做传输任务的取消。
russh-sftp = "2.4"

# SOCKS5 客户端。SSH 本身不认识代理，代理换掉的是它下面那条 TCP：这里只用
# `Socks5Stream::connect` 握一次手，拿到的流交给 `russh::client::connect_stream`
# （见 src/ssh/connection.rs 的 `dial`）。
#
# 是真新增的一份编译，不是白捡的：它确实出现在 Cargo.lock 里（gpui 那条链上的
# `gpui-pre-reqwest` 列着它），但那是锁文件记的"所有平台所有可选特性的并集"，
# reqwest 的 socks 特性在我们这张图里没开，`cargo tree -i tokio-socks` 之前是空的。
# 代价盘干净了才留：新编译的只有它自己和 `either`，`futures-util` 与
# `thiserror` 本来就在图里。
#
# 不自己手写这段握手，尽管 `src/ssh/forward.rs` 里已经有一份手写的 SOCKS5
# 服务端（动态转发 `-D` 那一头）—— 那两处**故意**保持不同的来源：`-D` 开出来的
# 监听是台真代理，用户可以把另一台主机的代理指到它上面，那时候是我们的客户端在
# 连我们自己的服务端。两头共用一份编解码的话，编码错了也会自洽地互通，而
# 浏览器连不上；各自独立才让那条链路成为一次真正的 RFC 1928 一致性检验。
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["rt", "compat"] }

# 远端 mtime 是 Unix 时间戳，表格要按本地时区显示绝对时间。chrono 本来就在依赖树里
# （`russh-sftp` 用它），这里只是把它变成直接依赖，不多编译一份东西。
chrono = "0.4"

# `hosts.forwards` 那一列存的是一串端口转发规则（见 src/forward.rs）。一列存一个
# 列表就得挑个编码，选 JSON：库文件用 sqlite3 打开时那一列还是读得懂的，加字段
# 也只是多一个 `#[serde(default)]`，不必再动一次表结构。serde 与 serde_json 本来
# 就在依赖树里（sea-orm 用它们），变成直接依赖不多编译一份东西。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 订阅正文是 YAML（Clash 配置），见 `src/clash/config.rs`：要读懂里面的节点、
# 策略组与分流规则给界面看，还要把端口那几项盖进去再交给 mihomo。这份解读
# 用 serde 那套 `Value` 来做，所以挑的是 serde_yaml 那一族的维护分支 ——
# 上游 `serde_yaml` 0.9 已归档停更，`serde_yaml_ng` 是它的直接后继（同一个
# unsafe-libyaml 底座，API 逐字兼容，改动只在修 bug），换过去只是换个名字。
serde_yaml_ng = "0.10"

# 主机配置的数据层：SeaORM 负责 SQLite 的访问，sqlx 自带静态编译的 SQLite，
# 不依赖系统安装的库；异步操作跑在应用级 tokio runtime 上（见 src/db/mod.rs）。
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
# `process` 那一档是 Clash 订阅要的：mihomo 是个独立程序，由我们起、由我们收
# （见 `src/clash/runtime.rs`）—— 不用它就得回到同步的 `std::process`，把整个
# 会话线程堵在 `wait()` 上。`signal` 不开：Windows 上没有信号可发，停子进程
# 走的是 `kill()`。
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "fs", "process"] }
# 跨平台的应用数据目录（Windows 是 %APPDATA%，macOS 是 ~/Library/Application Support）。
dirs = "6"

# 保险箱要的随机源：生成随机密码（`credential::PasswordRecipe::generate`）与
# 生成 SSH 密钥对（`ssh::keygen`）。`rand::rng()` 是 `ThreadRng`，密码学安全 ——
# 生成出来的东西是要拿去当身份用的，可预测的伪随机在这里是个漏洞。版本跟着
# `ssh-key` 要的 `rand_core` 0.10 走，不然 `PrivateKey::random` 收不下它。
rand = "0.10"

# 智能助手的 Agent 运行时。rig 0.42 拆成两层：`rig-core` 是供应商无关的
# 模型/消息/工具契约（openai 与 anthropic 两种协议的客户端都在它的
# `providers` 下），`rig-agent` 是经典的 builder + 运行循环 + 类型化钩子。
# 人工审核就落在钩子上：`AgentHook::on_tool_call` 返回 Run / Skip / Stop，
# 不必自己手写多轮循环。
#
# `rig-agent` 对 `rig-core` 是 default-features = false 的依赖，HTTP 后端
# （reqwest + rustls）得由我们这份直接依赖把特性点亮 —— 少了它，构建期
# 就没有任何一个能发请求的 `HttpClientExt` 实现。`derive` 特性不开：
# 工具就一个，手写 `Tool` impl 比再拖一份宏展开的依赖便宜。
rig-agent = { version = "0.42", default-features = false }
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }

# 界面文案的多语言查表。选 rust-i18n 是因为组件库自己就在用它（见
# `refs/gpui-kit/crates/component/src/lib.rs` 的 `i18n!`）：同一个库意味着
# `set_locale` 一次就同时切掉应用和组件库两边的文案，不必各切一遍；4.2 起的
# `extend!` 还让我们能只覆盖组件库里想改的那几条，不必抄一整份 ui.yml。
# 语言表在 `locales/`，编译期读进二进制，运行时不找文件。
rust-i18n = "4.2"
# 启动时问一下系统"现在是什么语言"。它本来就在依赖树里（cosmic-text 用它），
# 变成直接依赖不多编译一份东西；比自己读 LANG / GetUserDefaultLocaleName 稳。
sys-locale = "0.3"
# WebDAV（WebDAV 主机的文件面板，见 `src/webdav/` 与 `crate::service::WebdavService`；
# 以及备份同步的 WebDAV 那一档，见 `src/backup.rs`）。
#
# 直接用 reqwest_dav，不再经 OpenDAL 转一道：OpenDAL 一个 crate 就拖进几十个
# 传递依赖（它按"所有服务共用一套 op 抽象"长的），而我们只要 WebDAV 那七八个
# 方法；它的 `Operator` 是一层与面板无关的抽象，列目录给的是它自己的 `Entry`，
# 权限、属主这些字段到面板那一步还得再折一次。
#
# 0.3.3 是 crates.io 上的当前版本，它自己钉的就是 `reqwest ^0.13`（与下面那一行
# 同一份 reqwest，不多编译一份东西）。**默认特性必须关掉**：它默认点的是
# `reqwest/default`，那一档会带进 native-tls（SChannel / OpenSSL 一整套），
# 与全项目的 rustls 后端相冲；换成 `rustls-tls` 才是同一套 TLS。
# 认证支持 Basic 与 Digest（见 `Auth`），够那些普通的 WebDAV 服务器用。
reqwest_dav = { version = "0.3.3", default-features = false, features = ["rustls-tls"] }
# FTP / FTPS（FTP 主机的文件面板，见 `src/ftp/` 与 `crate::service::FtpService`）。
# 直接用 suppaftp，不再经 OpenDAL 转一道：OpenDAL 的 FTP 只有明文、没有隐式
# FTPS、拨号不走代理，也拿不到 `PWD` 给的登录目录。
#
# TLS 走 rustls（aws-lc-rs，与 russh、reqwest 同一个后端），**不用 native-tls**：
# FileZilla Server、vsftpd 默认要求数据通道恢复控制连接的 TLS 会话
# （`425 TLS session of data connection not resumed`），native-tls 在哪个平台上
# 都不给会话复用的开关；rustls 给，见 `src/ftp/client.rs` 里 `connector` 的说明。
# 证书先问系统证书库，系统不认再弹确认框按指纹认，见 `src/ftp/tls.rs`。
# `deprecated` 开的是隐式 FTPS（990 端口）那个入口 `connect_secure_implicit`，
# 协议上不推荐，但老 NAS、Serv-U 一类还在用。
suppaftp = { version = "10", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
# FTPS 证书校验的"系统证书库"那一层（Windows 上是系统的证书链引擎）。它本来
# 就在依赖树里（reqwest 0.13 用它），变成直接依赖不多编译一份东西。
rustls-platform-verifier = "0.7"
# 不受信任证书确认框上的主题、颁发者、有效期从证书里解出来。同样本来就在
# 依赖树里（IronRDP 用它）。
x509-cert = { version = "0.2", default-features = false }
# S3 对象存储（S3 主机的文件面板、备份同步的 S3 一档），见 `src/s3/`。
# rust-s3 一个 `Bucket` 就是一只完整的 S3 客户端：SigV4 签名、列桶、
# ListObjectsV2、分片上传、服务端复制都在里面，不再自己补签名与 XML。
#
# 只开 `with-tokio`（reqwest 0.12 后端）与 `fail-on-err`（非 2xx 一律当错误
# 抛回来，带着状态码与对端原话）。它自带的几档 TLS 特性都不合适：
# `tokio-native-tls` 拖进 SChannel/OpenSSL 一整套；`tokio-rustls-tls` 连带
# 点亮 aws-creds 的 attohttpc（去 EC2 元数据取凭据用的，我们的密钥都是
# 显式给的），而且只认 webpki-roots 那份内置根证书。TLS 由下面那一行替它点亮。
rust-s3 = { version = "0.38", default-features = false, features = ["with-tokio", "fail-on-err"] }
# rust-s3 那份 reqwest 0.12 的 TLS 后端。这一行不在代码里出现，只为特性合并：
# 0.12 在图上本来就有（IronRDP 的 KDC 请求），但谁都没给它开 TLS，S3 的
# https 端点就连不上。选 rustls + 系统根证书：和从前 OpenDAL 那份 reqwest 0.13
# 一样认 Windows 证书库，自建 MinIO 用企业内部 CA 签的证书照样能连；
# 加密后端走进程默认的 aws-lc-rs（`src/tls.rs`），它点亮的 `ring` 本来就被
# EasyTier 编进来了，不多编一套。
reqwest-s3-tls = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
aes-gcm = "0.11.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
# 注意：这一份在文件末尾被 `[patch.crates-io]` 换成了打过补丁的本地副本
# （`vendor/vnc-rs`）—— 剪贴板那两处上游绕不开的事都落在那里，见那条注释。
vnc-rs = "0.6.0"
# VNC 画布打包给 GPUI 用的像素容器：`gpui::RenderImage` 吃的就是 `image` 的
# 一帧 `RgbaImage`（见 `src/vnc/canvas.rs`），版本与 gpui 依赖的那份同一条
# 解析线。
#
# 编解码器那几档是智能助手的图片要的（`src/assistant/image.rs`）：剪贴板里的
# 截图在 Windows 上是一张 BMP（CF_DIB），浏览器复制出来的可能是 WebP / GIF，
# 统统解开、缩到模型收的尺寸，再编成 PNG（照片类太大时退成 JPEG）。这几档
# gpui 自己早就点亮了（它的剪贴板与 `img()` 靠它们解码），这里写出来只是不靠
# 特性合并的巧合，不多编译一份东西。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
# 系统托盘（见 `src/tray/`）。它自己建一个隐藏窗口收 shell 的回调，事件经
# 全进程的 channel 送出来 —— 不占主线程的消息循环，也不需要应用给它跑什么
# 循环，所以能和 GPUI 那套并存。
#
# Linux 上刻意关掉默认特性、只开 `ksni`：默认那一档是 libappindicator，它要
# 有 GTK 主循环在跑才轮得到菜单事件，而 GPUI 在 Linux 上跑的是自己的 calloop，
# 没有 GTK；ksni 走纯 Rust 的 D-Bus，自己在工作线程上服务，不碰 GTK。Windows
# 与 macOS 那两档不受这个特性影响。
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# 发给模型的图片是 base64（两种协议都只收这一种内联写法）。和 rig / reqwest
# 用的是同一份，本来就在依赖树里。
base64 = "0.22"
# VNC 经典剪贴板正文的字符集转换（见 `src/vnc/clipboard.rs`）。RFB 那条正文
# 没有字符集字段，现实里各家服务器塞的是自己那台机器的本地编码 —— Windows
# 一侧就是系统 ANSI 代码页（简体中文 GBK/936、繁体 Big5/950、日文 932、
# 韩文 949）。这些编码表自己写一份不现实，`encoding_rs` 是 Firefox 的那一份，
# 本来就在依赖树里（reqwest 的 charset 一档拉的就是它），不多一行编译。
encoding_rs = "0.8"

# RDP（远程桌面）客户端。协议是 Microsoft 的 RDP，整套由 IronRDP 提供：
# `ironrdp` 是那个门面 crate，把连接序列（connector）、会话状态机（session）、
# 输入数据库（input）、剪贴板通道（cliprdr）、位图/指针处理（graphics, pdu）
# 一起 re-export 出来，和 gpui-kit 是同一个门面思路。
#
# 门面里没有的两块要单独列：`ironrdp-tokio` 是把状态机套在 tokio 流上的
# `Framed`/connect 助手（SSH 那边有 russh 代劳，RDP 这边没有），
# `ironrdp-tls` 是 TLS 升级。铁律和 gpui 那条一样 —— 这几份必须来自同一批
# 版本，各自的窄依赖（connector 0.10 / session 0.11 / pdu 0.9……）由它们自己
# 对齐；`ironrdp` 门面把它们钉在同一版。
#
# TLS 后端选 rustls + aws-lc-rs：和 russh 的加密后端同一份 aws-lc-sys，
# 不多编一套 C 库；`rustls` feature 是 `rustls-aws-lc-rs` 的简写。
# cert 验证按上游默认关着（`ironrdp-tls` 的 rustls 后端写死
# `NoCertificateVerification`，理由在那一份源码里，企业自签证书的 RDP
# 服务器太常见），我们没有比它更严的口径，就没做一个假的"证书开关"。
#
# 没开 `client` feature（那会拖进 ironrdp-client 那个自带事件循环的引擎）：
# 它的剪贴板在 Windows 上用 Win32 剪贴板、其余平台是 Stub，接不到 GPUI 的
# 剪贴板；而且它每帧把整张图再转一遍 u32。我们自己驱动状态机（照
# `src/rdp/session.rs` 的模块文档），剪贴板走 `CliprdrBackend` 桥到 GPUI，
# 和 VNC 那条路是一个形状。剪贴板里的文件复制（`FileGroupDescriptorW` 文件
# 流、锁与超时、路径消毒）用的是 `ironrdp-cliprdr` 0.7 自带的那套状态机 ——
# lamco-rdp 贡献给上游的实现；我们只接本地落盘与读文件，见 `src/rdp/file_copy.rs`。
#
# 不开任何 feature 时门面连 pdu/core 都没有，所以 core 与 pdu 要点名带上；
# `displaycontrol` 是动态改分辨率那条 DVC（窗口拖大拖小用）。
ironrdp = { version = "0.17", default-features = false, features = ["core", "pdu", "connector", "session", "input", "cliprdr", "graphics", "dvc", "svc", "displaycontrol"] }
# `reqwest` 这一档给 CredSSP 里的 KDC 请求（Kerberos 那条路）备一个
# `NetworkClient` 实现；NTLM 走不到它，但错误必须在编译期就有个答案。
# reqwest 本来就在依赖树里（rig 的 HTTP 后端），这里只多开它一个 feature。
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-tls = { version = "0.2", features = ["rustls"] }
# FastPath 帧边界适配使用同一份解压器，避免为识别帧标记重复解压。
ironrdp-bulk = "0.1.1"

# EasyTier 组网（见 `src/easytier/`）。EasyTier 是一个去中心化的 P2P 组网工具，
# 同样用 Rust 写成；这里不起 `easytier-core` 子进程，而是把它的库嵌进来 ——
# 一台"主机"就是一个进程内的实例，状态直接读实例的运行快照。
#
# 走 git 并钉 rev，因为 crates.io 上那一份停在 2.0.3（2024 年），和现在的
# 上游隔着一整次重构（2.7 把控制面拆成了 `easytier-core`）。钉的是 main 上
# 一个具体提交，不跟分支漂：升级就是换这两行的 rev，再跑一遍
# `cargo test easytier`（`src/easytier/` 里有进程内两个实例互连的用例）。
# 两行必须同一个 rev —— `easytier` 自己也依赖 `easytier-core`，rev 不一致就是
# 两份不同的 `CoreInstance` 类型。许可证是 LGPL-3.0。
#
# 特性全部手点（`default-features = false`）：默认那一整套里有命令行、UPnP、
# 魔法 DNS、KCP 这些嵌进桌面应用用不上的东西（KCP 还要 bindgen + libclang）。
# 点了的：
# - `web-client`：`network_instance_running_info` 那份运行快照（节点、路由、
#   连接统计）在这一档后面，状态面板就靠它；
# - 隧道 `websocket`（ws / wss）、`quic`、`wireguard`（wg），加上始终在的
#   tcp / udp —— `easytier-core -p` 认得的协议这里都认（表单用 EasyTier 自己的
#   `TunnelScheme` 校验）；`endpoint-discovery` 是 `txt://` / `srv://` /
#   `http(s)://` 那几种"去这儿查节点地址"的节点发现；
# - `smoltcp` + `socks5`：用户态 TCP/IP 栈与 SOCKS5 入口 —— 不建虚拟网卡时
#   经它访问虚拟 IP，出厂档就是这一种，不要管理员权限；
# - `tun`：虚拟网卡那一档（要管理员权限，Windows 上还要 `wintun.dll` 在 exe
#   旁边 —— 它放在 `third_party/<架构>/`，`build.rs` 构建时拷过去，发版一起打包）；
# - `dhcp-ipv4`：由网络分配虚拟地址（`-d`），不点亮它只能手填地址；
# - `proxy-cidr-monitor`：盯着别的节点宣告的代理子网（它们的 `-n 192.168.1.0/24`），
#   有增减就发事件，虚拟网卡那一档靠这个事件把子网路由加到网卡上。不点它，
#   虚拟 IP 照样通（网卡自己那段地址是系统直接挂的路由），代理出来的子网却
#   一个都到不了，而且不报错 —— 上游只打一行 error 日志就收手了。它和
#   `dhcp-ipv4` 在上游同属默认开着的 `extended-services` 那一组，手点特性时
#   最容易漏；那一组剩下的 `public-ipv6-provider` 是分配公网 IPv6 那一档，没接；
#   `vpn-portal` / `wrapped-transport` 已由 `wireguard` / `quic` 带上。
# - `icmp-proxy`：本机把自己这一侧的网段代理给网（主机表单里的「子网代理」）时，
#   替别的节点转发 ping。TCP / UDP 的子网代理不靠它（`quic` 已带上 `proxy-packet`），
#   但少了它，别人 ping 那个网段一个回包都没有，头一步就当成代理不通。它要原始
#   套接字，也就是管理员权限：虚拟网卡那一档本来就有；用户态那一档没权限时上游只
#   打一行 warn、照常起，少的只是 ping。
# - `tcp-hole-punch`：TCP 打洞，和 UDP 打洞一起决定两台节点能不能直连；
# - `ring-crypto`：数据加密的后端（aes-gcm / aes-256-gcm / chacha20 都在里面）。
#   不点它，出厂的 aes-gcm 在这一版里"不可用"、实例直接起不来（`wireguard`
#   其实也顺带点亮它，写明是为了不靠这层巧合）。
#
# 唯一没开的隧道是 `faketcp`：它要原始套接字（管理员权限），而且拖进来的
# `pnet_datalink` 在 Windows 上静态链接 WinPcap 的 `Packet.lib` —— exe 链接要
# 那个 .lib，启动要 `Packet.dll`，没装 Npcap 的机器上整个应用都起不来。
#
# websocket / quic / 节点发现会把 rustls 的 `ring` 后端也点亮，和我们一直用的
# `aws-lc-rs` 同时在图上；这时不指名后端的 `ClientConfig::builder()`（IronRDP、
# hyper-rustls、EasyTier 自己的 wss 都走它）会 panic，所以 `main` 开头先把
# `aws-lc-rs` 装成进程默认，见 `src/tls.rs`。
#
# 构建要 `protoc`：`easytier-proto` 的构建脚本用 prost-build 现编 protobuf。
# macOS `brew install protobuf`、Debian/Ubuntu `apt install protobuf-compiler`；
# Windows 上那个构建脚本自己会下一份。x86_64 Windows 上 `easytier` 的构建脚本
# 还会用 curl + 7z 下载 VC-LTL（它为 Win7 兼容做的 CRT 替换，经 link-search
# 作用到最终的 exe 上）—— GitHub 的 Windows runner 两样都有。
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "ff3921ce6842f9660d629eafac499498026c6784", default-features = false, features = ["web-client", "smoltcp", "socks5", "tun", "dhcp-ipv4", "proxy-cidr-monitor", "icmp-proxy", "tcp-hole-punch", "ring-crypto", "websocket", "quic", "wireguard", "endpoint-discovery"] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier", rev = "ff3921ce6842f9660d629eafac499498026c6784", default-features = false }
# 进程级 rustls 后端的开关（`src/tls.rs`）。EasyTier 的 WebSocket / QUIC 隧道把
# rustls 的 `ring` 后端也点亮了，两个后端同在时不指名后端的入口会 panic，
# 开进程时要先把 `aws-lc-rs` 装成默认 —— 要调它就得直接依赖 rustls。版本就是
# 图上已有的那一份，不多编译一份东西。
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# EasyTier 的配置模型里，节点地址是 `url::Url`、虚拟地址是 `cidr::Ipv4Inet`；
# 编进来了哪几种隧道协议由它的 `IpScheme` 枚举说了算，列举那张表要 strum 的
# `VariantArray`。三个都本来就在依赖树里（EasyTier 用它们），变成直接依赖不多
# 编译一份东西。
url = "2"
cidr = "0.3"
strum = "0.28"
# WebDAV 那一头的两件小工具，本来就在依赖树里（`url` 与 reqwest 自己都拖着
# 它们），变成直接依赖不多编译一份东西。
#
# `percent-encoding`：服务器在 `PROPFIND` 回的 href 里把中文与空格编成了
# `%E4%B8%AD%E6%96%87`，面板要显示原字符就得解一次（见 `src/webdav/client.rs`）。
# `bytes`：流式传输的正文按块过手，块类型就是它（见
# `src/service/webdav_service.rs` 的下载循环）。
percent-encoding = "2"
bytes = "1"

# Clash 订阅那两处 HTTP（见 `src/clash/`）：拉订阅正文本体，以及跟本机
# mihomo 的外部控制口说话。图上本来就有 reqwest 0.13（`reqwest_dav` 的
# WebDAV 传输、rig 的后端都用它），这里只是把它变成直接依赖，
# 不多编译一份东西 —— 所以版本跟着图上那一份走。
#
# 关掉默认特性、只留 `rustls` 与 `json`：默认那一档里 `system-proxy` 是要
# 紧的一项 —— 它会让 reqwest 去读 Windows 的系统代理设置，而我们**正是**在
# 改那份设置的那一方（`src/clash/system_proxy.rs`）。代理开着的时候，连
# `127.0.0.1` 上那个控制口都可能被绕进代理里，于是"设置系统代理"这一步自己
# 先把控制通道掐了。两处请求都显式 `no_proxy()`，这一档干脆不点亮。
#
# `stream` 是 WebDAV 传输要的：下载走 `Response::bytes_stream()`、上传用
# `Body::wrap_stream()` 一块一块喂，都不把整个文件读进内存（见
# `src/service/webdav_service.rs`）。reqwest 0.13 里这几个入口都挂在这个特性下。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

# russh 的默认加密后端 aws-lc-rs 会用 C + 汇编编译 aws-lc-sys；在 x86_64 Windows 上
# 它的汇编要靠 NASM 汇编，本机没有 nasm.exe 时 build 脚本直接 panic。开启
# `prebuilt-nasm` 让 aws-lc-sys 使用 crate 里随附的预汇编 .obj，构建机就不必再装 NASM。
# 这里通过 feature 统一间接作用在 russh 依赖的那份 aws-lc-rs 上，版本与 russh 的要求一致；
# resolver v2 下这一段只在编译 Windows 目标时生效，不会影响 Linux/macOS。
aws-lc-rs = { version = "1.16.2", features = ["prebuilt-nasm"] }
# Clash 的「系统代理」那一档（见 `src/clash/system_proxy.rs`）：往
# `HKCU\…\Internet Settings` 里写 `ProxyEnable` / `ProxyServer`，改完再喊一声
# `InternetSetOptionW` 让已经开着的程序当场认账。两件事分属两份 API ——
# 注册表用 `winreg`（它自己就是 windows-sys 的薄封装，读写值不必手搓
# `RegQueryValueExW` 那一套缓冲区），广播用 windows-sys 的 WinInet 那一档。
# 两个版本都跟着图上已有那一份走；其余平台没有这一档，开关会说清楚。
winreg = "0.56"
# 提权 broker 那一档（`src/clash/broker.rs` 与 `src/bin/broker.rs`）要用到：
# 装服务那一次 UAC 的 ShellExecuteExW(runas)（Win32_UI_Shell）、
# SCM 服务的装/起/停/卸（Win32_System_Services）、
# 服务与用户进程的双向 AMSI（Win32_System_Services）、
# 管道对端互认 PID（Win32_System_Pipes）、
# GPUI 那条线程上探管道用的裸 CreateFileW（Win32_Storage_FileSystem）、
# 客户端正身再造以进 job（Win32_System_Threading）、
# job object 保险丝（Win32_System_JobObjects）、
# 令牌查询与复制（Win32_Security）、
# 服务那根管道的 SDDL 安全描述符（Win32_Security_Authorization）、
# ShellExecuteExW 里的 COM 初始化（Win32_System_Com）。
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Com",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# 根包 `winssh-pro`（应用外壳）自己的依赖：全部经 `workspace = true` 继承上面
# 那份钉子。随着后端逐层下沉到 `crates/*`，这里会逐步瘦身，最终只剩 UI / main /
# 托盘 / 单实例这些应用层真正直接用的东西。
[dependencies]
winssh-domain = { workspace = true }
winssh-tls = { workspace = true }
winssh-db = { workspace = true }
winssh-easytier = { workspace = true }
winssh-proxy = { workspace = true }
winssh-ssh = { workspace = true }
winssh-sftp = { workspace = true }
winssh-localfs = { workspace = true }
winssh-s3 = { workspace = true }
winssh-serial = { workspace = true }
winssh-telnet = { workspace = true }
winssh-webdav = { workspace = true }
winssh-ftp = { workspace = true }
winssh-broker-protocol = { workspace = true }
winssh-clash = { workspace = true }
winssh-assistant = { workspace = true }
winssh-zmodem = { workspace = true }
winssh-terminal = { workspace = true }
winssh-desktop = { workspace = true }
