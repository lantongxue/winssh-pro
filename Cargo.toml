[package]
name = "winssh-pro"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = "refs/gpui-component/crates/ui", version = "0.5.2" }
gpui-component-assets = { path = "refs/gpui-component/crates/assets", version = "0.5.1" }

# 终端内核。VT 解析、屏幕缓冲、滚动回卷与 PTY 都由 alacritty 提供。
# 用的是 zed 的那个 fork，rev 与 `refs/zed` 自己钉的一致（见 refs/alacritty）：
# `src/terminal/` 是照着 zed 的 `crates/terminal` + `crates/terminal_view`
# 移植的，API 必须对得上。和 gpui 一样落到本地检出，不走网络克隆。
alacritty_terminal = { path = "refs/alacritty/alacritty_terminal", version = "0.26.1-dev" }
futures = "0.3"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"

# SSH 传输：russh 是 Tokio 上的异步 SSH-2 客户端/服务端实现，aws-lc-rs 为默认加密后端。
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs", "rsa"] }
ssh-key = { version = "0.7.0-rc.11", features = ["encryption"] }

# 主机配置的数据层：SeaORM 负责 SQLite 的访问，sqlx 自带静态编译的 SQLite，
# 不依赖系统安装的库；异步操作跑在应用级 tokio runtime 上（见 src/db/mod.rs）。
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "fs"] }
# 跨平台的应用数据目录（Windows 是 %APPDATA%，macOS 是 ~/Library/Application Support）。
dirs = "6"

# russh 的默认加密后端 aws-lc-rs 会用 C + 汇编编译 aws-lc-sys；在 x86_64 Windows 上
# 它的汇编要靠 NASM 汇编，本机没有 nasm.exe 时 build 脚本直接 panic。开启
# `prebuilt-nasm` 让 aws-lc-sys 使用 crate 里随附的预汇编 .obj，构建机就不必再装 NASM。
# 这里通过 feature 统一间接作用在 russh 依赖的那份 aws-lc-rs 上，版本与 russh 的要求一致；
# resolver v2 下这一段只在编译 Windows 目标时生效，不会影响 Linux/macOS。
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1.16.2", features = ["prebuilt-nasm"] }

# `src/ssh/exec.rs` 的回环测试要在进程内起一台 `russh` 服务端，它需要一个临时的
# 主机密钥，而生成密钥要一个系统随机源。产物本身用不到（密钥交换的随机数在
# `russh` 里面），所以只在测试里依赖，不进二进制。
[dev-dependencies]
rand = "0.10"

# The reference checkouts under `refs/` are the sources of truth for both the
# GPUI runtime and the component library, so the git coordinates above resolve
# to the local trees instead of the network.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "refs/zed/crates/gpui" }
gpui_platform = { path = "refs/zed/crates/gpui_platform" }
gpui_macros = { path = "refs/zed/crates/gpui_macros" }
gpui_web = { path = "refs/zed/crates/gpui_web" }
reqwest_client = { path = "refs/zed/crates/reqwest_client" }
