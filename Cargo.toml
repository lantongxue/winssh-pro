[dev-dependencies]
# 上层（服务层/助手/端口转发对话框）的测试要用 `winssh-ssh` 里那台进程内假
# sshd（`ssh::exec::fake`），它门在 `test-support` 特性后面；这里点亮，正式构建不带。
winssh-ssh = { workspace = true, features = ["test-support"] }
# 同理：服务层/备份落点的测试要用 `winssh-webdav` 里那台回环假 WebDAV 服务器。
winssh-webdav = { workspace = true, features = ["test-support"] }
# 同理：zmodem 传输面板的测试要用 `winssh-terminal` 里那个离线“收件箱”
# （`take_sent_by_test`）验协议方向。
winssh-terminal = { workspace = true, features = ["test-support"] }
# 同理：ui 测试要用服务层各 `*Service::in_memory_blocking` 搭内存库。
winssh-service = { workspace = true, features = ["test-support"] }
# 让界面能在无窗口的测试里真的画一遍（`TestAppContext` + `window.draw`）。
# 有些错只在完整的 layout/prepaint/paint 走完之后才暴露 —— 比如元素树自己
# 套自己，编译期看不出来，跑起来是栈溢出。门面 crate 的 `test-support` 转开的就是
# `gpui/test-support`，`#[gpui_kit::test]` 与 `TestAppContext` 由它带出来。
gpui-kit = { workspace = true, features = ["test-support"] }

# 假服务器要自己解一遍客户端 Provide 出去的 zlib 流（扩展剪贴板的正文），
# 才验得出"中文真从这条路上走过去了"。和 `vnc-rs` 用的同一份实现，
# 本来就在依赖树里，多不了多少编译量。
flate2 = { workspace = true }

# 剪贴板要的东西 `vnc-rs` 自己不做：扩展剪贴板（RealVNC / TigerVNC / noVNC 的
# 共同扩展，伪编码 0xc0a1e5ce，UTF-8 + zlib）的消息编解码，以及经典正文按字节
# 交给上层。上游两条都绕不开：`Text(String)` 用有损 UTF-8 解正文（一份按规范发
# 来的 Latin-1 `é` 会被吃成 U+FFFD），而扩展消息里最高位置位的长度，上游会当成
# 天文数字的经典正文，直接报错把会话带下水。0.6.0 已是 crates.io 上的最新版，
# 没有"升级即修"的路，于是在一份本地副本上打补丁：`vendor/vnc-rs` 逐字来自
# crates.io 的 0.6.0（含 LICENSE 与上游 git 信息），改动清单见
# `vendor/vnc-rs/PATCHES.md`；另补齐完整帧边界，避免应用显示半帧。
#
# 想挪成 `refs/` 那种子模块 fork 也容易：把那份目录推成一个仓库，这里改指
# `{ git = "…" }` 就行 —— 布局是照着那条路留的。
#
# 后面三处是同一场冲突（IronRDP 的 RustCrypto 预发布版 vs russh 的稳定版）的
# 三个落点，各自逐字来自 crates.io 的对应版本，逐文件改动清单见各自的
# PATCHES.md：
#
# - `vendor/ironrdp-connector`（0.10.0）只把 picky 的 default features 关掉。
#   它的 default 里 jose 会把 aes-gcm 钉在 `=0.11.0-rc.4`，而本 crate 只用到
#   不受 feature 门控的 `picky::key`；关掉之后这份 picky 与 sspi 早已在用的
#   那一份（同样 default-features = false）完全一致，也少编一堆 JOSE 代码。
# - `vendor/picky`（7.0.0-rc.25）把 16 条 RustCrypto 预发布精确锁放到稳定版
#   （curve25519-dalek、p256/p384/p521、ed25519-dalek、ecdsa、primeorder…）。
#   这批 crate 在图上必须只有一份，而 russh 要的是稳定版。
# - `vendor/sspi`（0.21.3）同理，放的是 sspi 自己那份锁（六条）。
#
# 没有稳定版可换的三条（rsa 0.10.0-rc.18、pkcs1 0.8.0-rc.4、
# rustcrypto-ff/group/ff_derive 0.14.0-rc.x）在 picky/sspi 的补丁里只去掉
# `=`，保留预发布版本号 —— russh 那条链不用它们，图上只有这一份。
#
# 最后两处是 GPUI 本体（gpui-kit 钉的 `=0.3.9` 快照），给它补一档"应用给的光标
# 位图"：RDP 的远端光标要当成真正的系统光标用（反色、隐藏、零延迟跟手），
# 而 GPUI 只有一张固定的 `CursorStyle` 表。`vendor/gpui-pre` 加接口（按 hitbox
# 登记一张光标图，平台不支持时退回样式），`vendor/gpui-pre-windows` 用
# `CreateIconIndirect` 落地。理由与逐文件改动见两边的 PATCHES.md。gpui-kit 升
# GPUI 版本时这两份要跟着重做 —— 版本对不上时 patch 不生效，应用侧用到的新接口
# 会直接编译报错，不会静默退回。
#
# 同一批快照上还有第二处补丁：**窗口隐藏**。托盘要"关窗缩起来、会话还连着"，
# 就得能把窗从屏幕上拿掉而不销毁它 —— GPUI 原来只有 `minimize_window`，那个
# 还占着任务栏，语义不对。`vendor/gpui-pre` 在 `PlatformWindow` 上加
# `hide_window`/`show_window`（带默认空实现，平台不支持就什么都不做，另以
# `Platform::supports_window_hiding` 说明），三份平台层各自落地：Windows 用
# `SW_HIDE`，macOS 用 `orderOut:`，X11 用 `unmap_window`。Wayland 协议里没有
# 这类请求，那一档如实回答 `false`。同样见各份 PATCHES.md。
#
# 还有一处与上面都无关：`vendor/block`（0.1.6）。macOS 平台层经 cocoa / metal /
# core-video 拖进来的 `block` 把一个 extern static 声明成空 enum，每次构建都报
# "will be rejected by a future version of Rust"（`uninhabited_static`）。0.1.6 是
# 最后一版，补丁只把那个空 enum 换成零尺寸的不透明结构体，见它的 PATCHES.md。
[patch.crates-io]
block = { path = "vendor/block" }
vnc-rs = { path = "vendor/vnc-rs" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }

# 依赖全部按发布级优化编译。gpui 与 alacritty_terminal 是每一帧真正在跑的代码，
# dev 默认的 opt-level=0 会让它们慢出一个数量级 —— 界面卡、CPU 占用高，多半就是
# 这个，而不是逻辑本身。
[profile.dev.package."*"]
opt-level = 3
