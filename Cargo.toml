[package]
name = "winssh-pro"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = "refs/gpui-component/crates/ui", version = "0.5.2" }
gpui-component-assets = { path = "refs/gpui-component/crates/assets", version = "0.5.1" }

# 终端内核。VT 解析、屏幕缓冲、滚动回卷与 PTY 都由 alacritty 提供。
# 用的是 zed 的那个 fork，rev 与 `refs/zed` 自己钉的一致（见 refs/alacritty）：
# `src/terminal/` 是照着 zed 的 `crates/terminal` + `crates/terminal_view`
# 移植的，API 必须对得上。和 gpui 一样落到本地检出，不走网络克隆。
alacritty_terminal = { path = "refs/alacritty/alacritty_terminal", version = "0.26.1-dev" }
futures = "0.3"

# The reference checkouts under `refs/` are the sources of truth for both the
# GPUI runtime and the component library, so the git coordinates above resolve
# to the local trees instead of the network.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "refs/zed/crates/gpui" }
gpui_platform = { path = "refs/zed/crates/gpui_platform" }
gpui_macros = { path = "refs/zed/crates/gpui_macros" }
gpui_web = { path = "refs/zed/crates/gpui_web" }
reqwest_client = { path = "refs/zed/crates/reqwest_client" }
