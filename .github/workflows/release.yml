name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - os: windows
            arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - os: macos
            arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
            extension: ""
          - os: macos
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            extension: ""

    steps:
      # workflow_dispatch 传进来的 `tag` 必须是远端已经存在的 tag，否则下一步
      # actions/checkout 会以 `+refs/heads/v0.1.0*:... +refs/tags/v0.1.0*:...`
      # 去 fetch，两边都命中不了 → git 直接 exit 1，错误信息还藏在重试里，
      # 光看日志要绕一圈才知道是 tag 没推。这里先校验一次，把失败原因写在最
      # 前面。运维侧的正解仍然是先 `git tag v0.1.0 && git push origin v0.1.0`
      # 再 dispatch；这一步只是让漏推 tag 的那次跑死得干脆点。
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG}" ]]; then
            echo "workflow_dispatch requires a non-empty 'tag' input"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.~-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected something like v0.1.0"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${TAG}" >/dev/null; then
            echo "Tag '${TAG}' does not exist on origin."
            echo "Create and push it first: git tag ${TAG} && git push origin ${TAG}"
            exit 1
          fi

      # 明确写成 `refs/tags/...`：只给短名时 checkout 会同时按 `heads/` 与
      # `tags/` 去 fetch，两个都空才失败，报错也更绕。tag push 触发时
      # `github.ref` 本来就是 `refs/tags/v...`，直接沿用。
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Install Linux package builders
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Package release artifact
        shell: bash
        run: |
          artifact="winssh-pro-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            cargo deb --no-build --target "${{ matrix.target }}" \
              --output "dist/$artifact.deb"
            cargo generate-rpm --target-dir "target/${{ matrix.target }}" \
              --output "dist/$artifact.rpm"
          else
            package_dir="$(mktemp -d)"
            cp "target/${{ matrix.target }}/release/winssh-pro${{ matrix.extension }}" \
              "$package_dir/"
            tar -czf "dist/$artifact.tar.gz" -C "$package_dir" \
              "winssh-pro${{ matrix.extension }}"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: winssh-pro-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true