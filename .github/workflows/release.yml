name: Build and publish release

on:
  push:
    tags:
      - "v*"
  # 手动运行有两种用法，看 `tag` 填没填：
  #
  # * **填了**（如 v0.1.0）：正式发版，和推 tag 触发一样，构建那个 tag、发 release。
  # * **留空**：调试构建。不看 tag，直接构建 "Use workflow from" 里选的分支
  #   （默认 main）此刻的那个提交，产物只挂在这次运行的 Artifacts 里，
  #   **不发 release、不建 tag**。版本号取 Cargo.toml 的版本加 `-dev.<短 SHA>`，
  #   安装包文件名里能看出是哪个提交打的。
  #
  # 平台勾选框两种用法都管用（调试某一个平台的打包时不必把六台机器全拉起来），
  # 默认全开；tag 推送没有这些输入，一律全量。正式发版只勾一部分时 release 照样发，
  # 上面只挂这几个平台的产物 —— tag 已有 release 的话是往里补传（同名文件覆盖），
  # 不会把别的平台已有的产物删掉。
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0. Leave empty for a debug build of the selected branch (no release)"
        required: false
        type: string
      linux_x64:
        description: "Linux x64"
        type: boolean
        default: true
      linux_arm64:
        description: "Linux arm64"
        type: boolean
        default: true
      windows_x64:
        description: "Windows x64"
        type: boolean
        default: true
      windows_arm64:
        description: "Windows arm64"
        type: boolean
        default: true
      macos_x64:
        description: "macOS x64 (Intel)"
        type: boolean
        default: true
      macos_arm64:
        description: "macOS arm64 (Apple Silicon)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # 工具链钉死，不跟着 stable 漂：sccache 的缓存键里有 rustc 本身的哈希，stable
  # 每 6 周一换，缓存就整体作废一次。要升级就改这里（只管 CI，本地开发不受影响）。
  RUST_TOOLCHAIN: "1.99.0"
  # Linux 打包工具也钉版本，好按版本号缓存编出来的二进制（见 build 里那两步）。
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.0"

jobs:
  # 定下这一次构建什么（哪个提交、版本号、发不发 release）、跑哪几个平台。
  # 后面的 build / release 一律只认这里的输出，不再各自去猜触发方式。
  # matrix 只能在这里动态算：它是纯 `include` 写法，而 GitHub 先拿 `exclude`
  # 去减基础组合、再追加 `include`，往 `exclude` 里填表达式那一招对 include
  # 进来的条目不起作用。
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # 只有调试构建要它：版本号得从 Cargo.toml 里读。只拉这一个文件、不拉子模块，
      # 几秒的事。手动运行时 checkout 默认取的就是所选分支的 `github.sha`。
      - name: Check out Cargo.toml
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      # 正式发版：workflow_dispatch 传进来的 `tag` 必须是远端已经存在的 tag，
      # 否则 build 里 actions/checkout 会以 `+refs/heads/v0.1.0*:... +refs/tags/v0.1.0*:...`
      # 去 fetch，两边都命中不了 → git 直接 exit 1，错误信息还藏在重试里，
      # 光看日志要绕一圈才知道是 tag 没推。这里先校验一次，把失败原因写在最
      # 前面。运维侧的正解仍然是先 `git tag v0.1.0 && git push origin v0.1.0`
      # 再 dispatch；这一步只是让漏推 tag 的那次跑死得干脆点。放在 plan 里
      # 只校验一次，失败时也不会白拉起一排构建机。
      #
      # 调试构建：钉死成 `github.sha` 而不是分支名 —— 六台机器起跑有先有后，
      # 中途有人往 main 推了提交的话，按分支名取会各自拿到不同的代码。
      - name: Resolve source
        id: source
        shell: bash
        # 别写成 `inputs.tag || github.ref_name` 一个表达式：tag 留空时空串在表达式
        # 里是假值，会退回 ref_name（也就是 `main`），调试构建就永远走不进来，
        # 只会报 "Invalid release tag: main"。两样分开传，在 bash 里挑。
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${IS_DISPATCH}" == "true" ]]; then
            TAG="${INPUT_TAG}"
          else
            # tag 推送触发：ref_name 就是那个 tag 的短名。
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ "${IS_DISPATCH}" == "true" && -z "${TAG}" ]]; then
            cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
            if [[ -z "${cargo_version}" ]]; then
              echo "Could not read the package version from Cargo.toml"
              exit 1
            fi
            version="${cargo_version}-dev.${GITHUB_SHA::7}"
            echo "Debug build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (version ${version}); no release will be published."
            {
              echo "ref=${GITHUB_SHA}"
              echo "version=${version}"
              echo "tag="
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.~-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected something like v0.1.0"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/tags/${TAG}" >/dev/null; then
            echo "Tag '${TAG}' does not exist on origin."
            echo "Create and push it first: git tag ${TAG} && git push origin ${TAG}"
            exit 1
          fi

          # 明确写成 `refs/tags/...`：只给短名时 checkout 会同时按 `heads/` 与
          # `tags/` 去 fetch，两个都空才失败，报错也更绕。
          echo "Release build of ${TAG}."
          {
            echo "ref=refs/tags/${TAG}"
            echo "version=${TAG#v}"
            echo "tag=${TAG}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      # 全量平台表在这里，每行第一列对应上面的勾选框名。加平台时两处（还有 env）一起加。
      - name: Select platforms
        id: matrix
        shell: bash
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
        run: |
          set -euo pipefail

          # macos arm64：macos-14 定于 2026-11-02 下线 —— 退役的标签不报错，任务只是
          # 一直排队，熬到 24h 被取消，release 那一步跟着 skipped（v0.0.1 就栽在
          # 退役的 macos-13 上），所以提前挪到 macos-15。
          # macos x64：不再起 Intel 机器，在 macos-15（Apple 芯片）上交叉编译
          # x86_64-apple-darwin。Apple 工具链原生支持两种架构，打包脚本也都按
          # `target/<triple>/release` 取产物；Intel 那台（macos-15-intel）同样的活
          # 要多花一半时间，而 macOS 的分钟数最贵，它自己也只支持到 2027-08。
          # 一行一个平台：勾选框名 os arch runner target extension（空扩展名写 -）。
          # 纯 bash 拼 JSON，不靠 jq —— 字段里都是没有引号、空格的标识符，用不着转义。
          platforms='
          linux_x64     linux   x64   ubuntu-24.04     x86_64-unknown-linux-gnu  -
          linux_arm64   linux   arm64 ubuntu-24.04-arm aarch64-unknown-linux-gnu -
          windows_x64   windows x64   windows-2022     x86_64-pc-windows-msvc    .exe
          windows_arm64 windows arm64 windows-11-arm   aarch64-pc-windows-msvc   .exe
          macos_x64     macos   x64   macos-15         x86_64-apple-darwin       -
          macos_arm64   macos   arm64 macos-15         aarch64-apple-darwin      -
          '

          include=""
          names=""
          while read -r id os arch runner target extension; do
            [[ -z "${id}" ]] && continue
            if [[ "${IS_DISPATCH}" == "true" ]]; then
              # 勾选框名转成上面 env 里的变量名（linux_x64 → LINUX_X64）再取值。
              var="${id^^}"
              [[ "${!var:-false}" == "true" ]] || continue
            fi
            [[ "${extension}" == "-" ]] && extension=""
            entry="{\"os\":\"${os}\",\"arch\":\"${arch}\",\"runner\":\"${runner}\",\"target\":\"${target}\",\"extension\":\"${extension}\"}"
            include="${include:+${include},}${entry}"
            names="${names:+${names}, }${os}-${arch}"
          done <<<"${platforms}"

          if [[ -z "${include}" ]]; then
            echo "No platform selected. Tick at least one platform when running the workflow manually."
            exit 1
          fi

          echo "Platforms: ${names}"
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # 编译缓存走 sccache（GitHub Actions cache 做后端），按源码内容哈希逐个 crate
    # 地存取，cc 编的 C 代码（tree-sitter 语法、aws-lc、sqlite）也一并缓存。
    # 不用 Swatinem/rust-cache：它存缓存前只保留 manifest 在仓库根**之外**的依赖，
    # `refs/`、`vendor/` 下的 gpui、ironrdp-connector、sspi、picky 一律被清掉；
    # 就算留下了，path 依赖靠 mtime 判新旧，新 checkout 的文件全像刚改过，
    # 照样整棵重编。这一串偏偏是最重的。
    #
    # 只有 main 上的运行（手动运行时选 main，不论填没填 tag）写缓存：tag 推送
    # 触发的运行存下的缓存只有那个 tag 自己读得到，下一个 tag 用不上，白占配额；
    # 但它读得到 main 的。GitHub 会清掉 7 天没被访问的缓存，发版隔得久的话，
    # 先在 main 上跑一次调试构建把缓存热起来。
    #
    # sccache 管不了的：构建脚本、proc-macro 和最后的可执行文件（要链接的都不缓存），
    # 以及根包 `winssh-pro` 自己 —— 它是 bin，每次都编。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # 根包一编就是好几分钟，期间没有可缓存的请求；默认 10 分钟没请求 sccache
      # 服务就退出，再起来统计就清零了，post 那一步报出来的命中率就不准。
      SCCACHE_IDLE_TIMEOUT: "0"
      # sccache 的键里含每个 `--extern` 依赖的文件内容，proc-macro 的 dll 也在内。
      # MSVC 系链接器默认往 PE 头里写当前时间戳，同一份代码每次链出来的 dll 都
      # 不一样，所有直接用到 proc-macro 的 crate（serde、tokio、gpui……）就永远
      # 命中不了。`/Brepro` 把时间戳换成内容哈希。走环境变量而不是 rustflags：
      # 带了 `--target` 时 rustflags 到不了构建脚本和 proc-macro，而 link.exe 与
      # lld-link 都会读 `_LINK_`。
      _LINK_: ${{ matrix.os == 'windows' && '/Brepro' || '' }}

    steps:
      # 取哪个提交由 plan 定：正式发版是 `refs/tags/v...`，调试构建是钉死的 SHA。
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 1
          submodules: recursive

      # `protobuf-compiler` 给 EasyTier 组网（`easytier-proto` 的构建脚本用
      # prost-build 现编 protobuf，要 `protoc`）。Windows 上那个构建脚本自己
      # 会下一份 protoc，不用在这里装；macOS 走下面那一步的 brew。
      # `libprotobuf-dev` 必须显式列：EasyTier 的 proto import 了
      # `google/protobuf/timestamp.proto` 这类 well-known types，它们装在
      # `/usr/include/google/protobuf/` 下、属于这个包，而它只是
      # `protobuf-compiler` 的 Recommends —— 在 `--no-install-recommends`
      # 下不会被带上，protoc 报 "timestamp.proto: File not found"。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev

      # aarch64 Linux 的默认链接器还是系统 ld（bfd），把它换成 mold。x86_64 Linux
      # 从 Rust 1.90 起默认就走自带的 rust-lld，Windows 的在 `.cargo/config.toml`，
      # macOS 的 ld-prime 本来就快 —— 都不用这一步。
      - name: Use mold linker
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: rui314/setup-mold@v1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      # `--timings` 出一份逐 crate 的耗时报告（谁在关键路径上、并行度如何），
      # 挂在下面那个 cargo-timings-* 产物里，砍依赖、调 opt-level 之前先看它。
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --timings

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.os }}-${{ matrix.arch }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

      # cargo-deb / cargo-generate-rpm 从源码编要 3~4 分钟，可 cargo-generate-rpm
      # 没有官方预编译、cargo-deb 只有 x86_64 的。版本钉在顶上的 env 里，编一次就
      # 按版本号把两个二进制缓存起来，之后直接复用。
      - name: Cache Linux package builders
        id: package-builders
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: package-builders-${{ matrix.target }}-cargo-deb-${{ env.CARGO_DEB_VERSION }}-cargo-generate-rpm-${{ env.CARGO_GENERATE_RPM_VERSION }}

      - name: Install Linux package builders
        if: runner.os == 'Linux' && steps.package-builders.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-deb@${CARGO_DEB_VERSION}" "cargo-generate-rpm@${CARGO_GENERATE_RPM_VERSION}"

      # Windows 这一支出两样：`*-setup.exe` 是给人下载的主产物（双击装、
      # 开始菜单里能卸载），`*.tar.gz` 留着 —— 它是免安装 / 脚本化分发
      # 更好接的那一份，和 macOS 那边 dmg + tar.gz 并存是一个道理。
      - name: Package release artifact
        shell: bash
        run: |
          artifact="winssh-pro-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            cargo deb --no-build --target "${{ matrix.target }}" \
              --output "dist/$artifact.deb"
            cargo generate-rpm --target-dir "target/${{ matrix.target }}" \
              --output "dist/$artifact.rpm"
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            # dmg 是给人下载的主产物（拖进 Applications）；tar.gz 留着，
            # 它是脚本化安装 / Homebrew cask 更好接的那一份。
            ./scripts/dmg-macos.sh "${{ matrix.target }}"
            tar -czf "dist/$artifact.tar.gz" -C "target/${{ matrix.target }}/release" "WinSSH Pro.app"
          else
            # wintun.dll 是虚拟网卡那一档（EasyTier TUN）按名字加载的驱动库，
            # 得和 exe 在同一个目录。build.rs 已按目标架构把它从 third_party/
            # 拷到了 exe 旁边，这里照原样一起打包；少了它 cp 直接失败。
            # winssh-broker.exe 是 Clash 那一档拨 TUN 时经 UAC 拉起的提权小助手
            # （见 src/bin/broker.rs），cargo 的必产物，与主 exe 同目录才能被找到。
            # mihomo.exe 不在这里打包 —— 订阅页会引导用户下载到用户数据目录
            # （见 src/clash/downloader.rs），clash::runtime::binary_path 会去那里找。
            package_dir="$(mktemp -d)"
            cp "target/${{ matrix.target }}/release/winssh-pro${{ matrix.extension }}" \
              "target/${{ matrix.target }}/release/winssh-broker${{ matrix.extension }}" \
              "target/${{ matrix.target }}/release/wintun.dll" \
              "$package_dir/"
            tar -czf "dist/$artifact.tar.gz" -C "$package_dir" \
              "winssh-pro${{ matrix.extension }}" winssh-broker${{ matrix.extension }} wintun.dll

            # 安装包用 Inno Setup 的 ISCC 编（脚本见 scripts/win-installer.iss）。
            # `windows-2022`（6.7.1）与 `windows-11-arm`（6.6.1）两个镜像都预装了
            # Inno Setup 6。它自己的安装程序是 32 位的，所以 arm64 镜像上也装在
            # `Program Files (x86)` 下，别去 `Program Files` 找。两边版本不齐没关系：
            # 仓库里 vendor 的中文译文是 6.4.0+ 那份，比两边都旧，缺的那几条消息
            # 编译器只报警告（`MissingMessagesWarning`）并退回英文原文。
            # `/D` 传的值对应 .iss 顶部那几个 `#ifndef`：版本号由 plan 给（正式发版
            # 是 tag 去掉前缀的 `v`，调试构建是 `<Cargo 版本>-dev.<短 SHA>`）；`Arch` 是给 Inno 认的架构标识
            # （x64 那支必须写 `x64compatible`，`x64` 在 6.3 起是废弃的
            # `x64strict`，会把 ARM64 Windows 挡在门外）；`ArchLabel` 只用于
            # 文件名，保持 `x64` / `arm64` 好认；`OutputDir` 指到 dist 下，
            # 与同一步里打的 tar.gz 落在一起，好被后面 upload-artifact 一并收走。
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            if [[ ! -x "$iscc" ]]; then
              echo "Inno Setup 6 (ISCC.exe) not found at: $iscc"
              exit 1
            fi
            version="${{ needs.plan.outputs.version }}"
            case "${{ matrix.arch }}" in
              x64) inno_arch=x64compatible ;;
              arm64) inno_arch=arm64 ;;
              *) echo "Unsupported Windows arch: ${{ matrix.arch }}"; exit 1 ;;
            esac
            # 必须关掉 Git Bash 的参数路径转换：它把以 `/` 开头的参数当成 Unix
            # 路径，`/DAppVersion=0.1.0` 会被改写成 `C:/Program Files/Git/DAppVersion=0.1.0`，
            # ISCC 把这几个都当成脚本文件名，报 "You may not specify more than one
            # script filename."。路径参数上面已经用 `cygpath -aw` 转好了，用不着它。
            # MSYS_NO_PATHCONV 是 Git for Windows 认的，MSYS2_ARG_CONV_EXCL 是 MSYS2
            # 认的，两个都设，不赌镜像上 bash 是哪一家。
            MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$iscc" \
              "/DAppVersion=$version" \
              "/DArch=$inno_arch" \
              "/DArchLabel=${{ matrix.arch }}" \
              "/DSourceDir=$(cygpath -aw "$package_dir")" \
              "/DOutputDir=$(cygpath -aw dist)" \
              "$(cygpath -aw scripts/win-installer.iss)"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: winssh-pro-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # 调试构建（手动运行、tag 留空）整个跳过：产物已经挂在这次运行的 Artifacts 里了。
  release:
    name: Publish GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      # 只收安装包那几个产物：同一次运行里还有 cargo-timings-*（构建耗时报告），
      # 不能跟着发进 release。
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: winssh-pro-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true